[build-system]
requires = ["setuptools>=64", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmip6-downscaling"
description = "Climate downscaling using cmip6 data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CarbonPlan", email = "tech@carbonplan.org" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

dependencies = [
    "icechunk>=2.0.6",
    "obstore>=0.10.1",
    "requests>=2.32.5",
    "xarray>=2026.4.0",
    "zarr>=3.2.1",
]

[project.optional-dependencies]
dev = ["pytest","pytest-sugar","pytest-cov"]
deepsd = ["tensorflow", "tensorflow-io"]
analysis = ["cartopy", "seaborn", "carbonplan[styles]"]


[project.urls]
repository = "https://github.com/carbonplan/cmip6-downscaling"

[tool.setuptools.packages.find]
include = ["cmip6_downscaling*"]

[tool.setuptools_scm]
local_scheme = "node-and-date"
fallback_version = "999"

[tool.ruff]
line-length = 100
target-version = "py312"
builtins = ["ellipsis"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.ipynb",
]

[tool.ruff.lint]
# E402: module level import not at top of file
# E501: line too long - let ruff format worry about that
# E731: do not assign a lambda expression, use a def
ignore = ["E402", "E501", "E731"]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # Pyupgrade
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["cmip6_downscaling"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
console_output_style = "count"
addopts = "--cov=./ --cov-report=xml --verbose"

[tool.pixi.workspace]
name = "cmip6-downscaling"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"

[tool.pixi.pypi-dependencies]
cmip6-downscaling = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = "*"
pytest-sugar = "*"
pytest-cov = "*"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }
